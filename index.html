<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đua Xe Gia Đình</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Be+Vietnam+Pro:wght@400;600;700&display=swap">
</head>
<body>
<style>
:root {
  --bg: #1b5e20;
  --fg: #e8e8f0;
  --road: #256427;
  --accent: #ff6b35;
  --accent2: #ffd166;
  --hp-good: #06d6a0;
  --hp-warn: #ffd166;
  --hp-bad: #ef476f;
  --card-bg: #16213e;
  --card-border: #0f3460;
  --overlay: rgba(10, 10, 30, 0.92);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f0ece2;
    --fg: #1a1a2e;
    --road: #4caf50;
    --accent: #e85d26;
    --accent2: #d4a843;
    --hp-good: #05b88a;
    --hp-warn: #d4a843;
    --hp-bad: #d63a5c;
    --card-bg: #fff8ee;
    --card-border: #ddd5c4;
    --overlay: rgba(240, 236, 226, 0.94);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f0ece2;
  --fg: #1a1a2e;
  --road: #4caf50;
  --accent: #e85d26;
  --accent2: #d4a843;
  --hp-good: #05b88a;
  --hp-warn: #d4a843;
  --hp-bad: #d63a5c;
  --card-bg: #fff8ee;
  --card-border: #ddd5c4;
  --overlay: rgba(240, 236, 226, 0.94);
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Be Vietnam Pro', sans-serif;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

#select-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 16px;
  gap: 20px;
}
#select-screen h1 {
  font-family: 'Bungee', cursive;
  font-size: clamp(1.6rem, 5vw, 2.4rem);
  color: var(--accent);
  text-align: center;
  text-shadow: 2px 2px 0 var(--accent2);
  letter-spacing: 0.02em;
}
#select-screen p {
  color: var(--accent2);
  font-size: 0.95rem;
  font-weight: 600;
}
.char-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  max-width: 360px;
  width: 100%;
}
.char-card {
  background: var(--card-bg);
  border: 2px solid var(--card-border);
  border-radius: 14px;
  padding: 12px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.char-card:active, .char-card.selected {
  transform: scale(0.96);
  border-color: var(--accent);
  box-shadow: 0 0 16px rgba(255, 107, 53, 0.4);
}
.char-card img {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--accent2);
}
.char-card .name {
  font-weight: 700;
  font-size: 0.9rem;
}
.char-card .stat {
  font-size: 0.72rem;
  color: var(--accent2);
  opacity: 0.85;
}
#start-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 30px;
  padding: 14px 48px;
  font-family: 'Bungee', cursive;
  font-size: 1.1rem;
  cursor: pointer;
  opacity: 0.4;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.1s;
  letter-spacing: 0.04em;
}
#start-btn.active {
  opacity: 1;
  pointer-events: auto;
}
#start-btn:active {
  transform: scale(0.95);
}

#game-screen {
  display: none;
  position: relative;
  width: 100%;
  height: 100%;
}
#game-canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#hud {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 8px;
  z-index: 10;
  pointer-events: none;
}
.hud-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.hp-bar-outer {
  flex: 1;
  height: 18px;
  background: rgba(0,0,0,0.4);
  border-radius: 9px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.15);
}
.hp-bar-inner {
  height: 100%;
  border-radius: 9px;
  transition: width 0.3s, background 0.3s;
  background: var(--hp-good);
}
.hud-score {
  font-family: 'Bungee', cursive;
  font-size: 1rem;
  color: var(--accent2);
  white-space: nowrap;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
}
.hud-hp-text {
  font-family: 'Bungee', cursive;
  font-size: 0.75rem;
  color: #fff;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  min-width: 52px;
  text-align: right;
}

#gameover-screen {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--overlay);
  z-index: 20;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 16px;
}
#gameover-screen h2 {
  font-family: 'Bungee', cursive;
  font-size: 2rem;
  color: var(--hp-bad);
}
#gameover-screen .final-score {
  font-family: 'Bungee', cursive;
  font-size: 1.4rem;
  color: var(--accent2);
}
#gameover-screen .best-score {
  font-size: 0.9rem;
  color: var(--fg);
  opacity: 0.7;
}
#leaderboard {
  width: 100%;
  max-width: 280px;
  margin: 8px auto 4px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.lb-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-radius: 10px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  font-size: 0.85rem;
}
.lb-row.current {
  border-color: var(--accent);
  background: rgba(255, 107, 53, 0.12);
}
.lb-rank {
  font-family: 'Bungee', cursive;
  font-size: 1.1rem;
  min-width: 28px;
  text-align: center;
}
.lb-rank.r1 { color: #ffd700; }
.lb-rank.r2 { color: #c0c0c0; }
.lb-rank.r3 { color: #cd7f32; }
.lb-rank.r4 { color: var(--fg); opacity: 0.5; }
.lb-name {
  flex: 1;
  font-weight: 600;
  color: var(--fg);
}
.lb-score {
  font-family: 'Bungee', cursive;
  color: var(--accent2);
  font-size: 0.85rem;
}
.go-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 30px;
  padding: 14px 40px;
  font-family: 'Bungee', cursive;
  font-size: 1rem;
  cursor: pointer;
  letter-spacing: 0.04em;
}
.go-btn:active { transform: scale(0.95); }

#game-btns {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 40px);
  right: 12px;
  z-index: 30;
  display: none;
  gap: 8px;
  pointer-events: auto;
  touch-action: auto;
}
#game-btns button {
  background: rgba(0,0,0,0.55);
  border: 1px solid rgba(255,255,255,0.25);
  color: #fff;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  font-size: 1.1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: auto;
  -webkit-tap-highlight-color: rgba(255,255,255,0.15);
}
#game-btns button:active {
  background: rgba(255,255,255,0.2);
}

.combo-popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(1.5);
  font-family: 'Bungee', cursive;
  font-size: 1.6rem;
  pointer-events: none;
  z-index: 15;
  opacity: 0;
  animation: comboPop 0.8s ease-out forwards;
}
@keyframes comboPop {
  0% { opacity: 1; transform: translate(-50%, -50%) scale(1.5); }
  100% { opacity: 0; transform: translate(-50%, -120%) scale(1); }
}

.dmg-flash {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 12;
  opacity: 0;
}
@keyframes flashRed {
  0% { opacity: 0.4; }
  100% { opacity: 0; }
}
@keyframes flashGreen {
  0% { opacity: 0.3; }
  100% { opacity: 0; }
}
</style>

<div id="select-screen">
  <h1>ĐUA XE GIA ĐÌNH</h1>
  <p>Chọn tay đua của bạn</p>
  <div class="char-grid" id="char-grid"></div>
  <button id="start-btn">BẮT ĐẦU</button>
  <button id="sound-toggle" style="background:var(--card-bg);border:2px solid var(--card-border);color:var(--fg);border-radius:30px;padding:10px 24px;font-family:'Be Vietnam Pro',sans-serif;font-size:0.85rem;cursor:pointer;font-weight:600">🔇 Bật âm thanh</button>
</div>

  <canvas id="game-canvas"></canvas>
</div>

<div id="hud">
  <div class="hud-row">
    <div class="hp-bar-outer"><div class="hp-bar-inner" id="hp-bar"></div></div>
    <div class="hud-hp-text" id="hp-text">100 HP</div>
  </div>
  <div class="hud-row" style="margin-top:4px">
    <div class="hud-score" id="score-text">0m</div>

  </div>
</div>

<div id="game-btns">
  <button id="exit-btn">✕</button>
  <button id="pause-btn">⏸</button>
  <button id="sound-btn">🔇</button>
</div>

<div id="gameover-screen">
  <h2>HẾT XĂNG!</h2>
  <div class="final-score" id="final-score"></div>
  <div id="leaderboard"></div>

</div>

<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let soundEnabled = false;

function ensureAudio() {
  try {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const silent = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    g.gain.value = 0;
    silent.connect(g);
    g.connect(audioCtx.destination);
    silent.start();
    silent.stop(audioCtx.currentTime + 0.01);
    soundEnabled = true;
    document.getElementById('sound-btn').textContent = '🔊';
  } catch(e) {}
}

function playTone(freq, duration, type, vol) {
  if (!audioCtx || !soundEnabled) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playNoise(duration, vol) {
  if (!audioCtx || !soundEnabled) return;
  const bufferSize = audioCtx.sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  src.connect(gain);
  gain.connect(audioCtx.destination);
  src.start();
}

const SFX = {

  start() {
    playTone(440, 0.15, 'square', 0.15);
    setTimeout(() => playTone(660, 0.15, 'square', 0.15), 150);
    setTimeout(() => playTone(880, 0.25, 'square', 0.2), 300);
  },
  hit() {
    playTone(150, 0.2, 'sawtooth', 0.2);
    playNoise(0.15, 0.15);
  },
  heal() {
    playTone(523, 0.1, 'sine', 0.15);
    setTimeout(() => playTone(659, 0.1, 'sine', 0.15), 80);
    setTimeout(() => playTone(784, 0.15, 'sine', 0.2), 160);
  },
  shield() {
    playTone(400, 0.3, 'sine', 0.12);
    playTone(800, 0.3, 'sine', 0.12);
  },
  jump() { playTone(300, 0.08, 'sine', 0.12); playTone(500, 0.12, 'sine', 0.1); },
  duck() { playTone(400, 0.08, 'sine', 0.1); playTone(250, 0.1, 'sine', 0.08); },
  combo() {
    playTone(700, 0.1, 'square', 0.12);
    setTimeout(() => playTone(900, 0.1, 'square', 0.12), 100);
    setTimeout(() => playTone(1100, 0.15, 'square', 0.15), 200);
  },
  dodge() { playTone(500, 0.06, 'sine', 0.06); },
  coin() { playTone(988, 0.08, 'sine', 0.15); setTimeout(() => playTone(1319, 0.12, 'sine', 0.15), 80); },
  gameover() {
    playTone(400, 0.3, 'sawtooth', 0.15);
    setTimeout(() => playTone(300, 0.3, 'sawtooth', 0.15), 300);
    setTimeout(() => playTone(200, 0.5, 'sawtooth', 0.2), 600);
  },
  engine() {
    playTone(80, 0.15, 'sawtooth', 0.04);
    playTone(120, 0.15, 'sawtooth', 0.03);
  },
  animalFriendly() {
    playTone(800, 0.08, 'sine', 0.15);
    setTimeout(() => playTone(1000, 0.08, 'sine', 0.15), 60);
    setTimeout(() => playTone(1200, 0.12, 'sine', 0.18), 120);
  },
  animalFierce() {
    playTone(120, 0.25, 'sawtooth', 0.2);
    playNoise(0.12, 0.18);
    setTimeout(() => playTone(90, 0.2, 'sawtooth', 0.15), 100);
  }
};

let selectedChar = null;
let game = null;

const charGrid = document.getElementById('char-grid');
const startBtn = document.getElementById('start-btn');
const selectScreen = document.getElementById('select-screen');
const gameScreen = document.getElementById('game-screen');
const hud = document.getElementById('hud');
const pauseBtn = document.getElementById('pause-btn');
const gameBtns = document.getElementById('game-btns');
const gameoverScreen = document.getElementById('gameover-screen');
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

const charImages = {};

CHARS.forEach((c, i) => {
  const card = document.createElement('div');
  card.className = 'char-card';
  card.innerHTML = `
    <img src="${c.img}" alt="${c.name}">
    <div class="name">${c.name}</div>
    <div class="stat">${c.desc}</div>
  `;
  card.addEventListener('click', () => {
    document.querySelectorAll('.char-card').forEach(el => el.classList.remove('selected'));
    card.classList.add('selected');
    selectedChar = i;
    startBtn.classList.add('active');
    SFX.select();
  });
  charGrid.appendChild(card);

  const img = new Image();
  img.src = c.img;
  charImages[i] = img;
});

startBtn.addEventListener('click', () => {
  if (selectedChar === null) return;
  if (!audioCtx) ensureAudio();
  startGame();
});
startBtn.addEventListener('touchend', (e) => {
  if (selectedChar === null) return;
  e.preventDefault();
  if (!audioCtx) ensureAudio();
  startGame();
});

const soundToggle = document.getElementById('sound-toggle');
function handleSoundToggle() {
  if (!audioCtx) {
    ensureAudio();
    SFX.select();
    soundToggle.textContent = '🔊 Âm thanh đã bật';
    soundToggle.style.borderColor = 'var(--accent)';
  } else {
    soundEnabled = !soundEnabled;
    if (soundEnabled) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      SFX.select();
      soundToggle.textContent = '🔊 Âm thanh đã bật';
      soundToggle.style.borderColor = 'var(--accent)';
    } else {
      soundToggle.textContent = '🔇 Bật âm thanh';
      soundToggle.style.borderColor = 'var(--card-border)';
    }
  }
}
soundToggle.addEventListener('click', handleSoundToggle);
soundToggle.addEventListener('touchend', (e) => { e.preventDefault(); handleSoundToggle(); });

const soundBtn = document.getElementById('sound-btn');
const exitBtn = document.getElementById('exit-btn');

function exitToMenu() {
  if (game) game.stop();
  if (engineTimer) { clearInterval(engineTimer); engineTimer = null; }
  gameScreen.style.display = 'none';
  hud.style.display = 'none';
  gameBtns.style.display = 'none';
  gameoverScreen.style.display = 'none';
  selectScreen.style.display = 'flex';
  game = null;
}

function startGame() {
  selectScreen.style.display = 'none';
  gameScreen.style.display = 'block';
  hud.style.display = 'block';
  gameBtns.style.display = 'flex';
  gameoverScreen.style.display = 'none';
  if (soundEnabled) SFX.start();
  game = new Game(CHARS[selectedChar]);
  game.start();
  if (engineTimer) clearInterval(engineTimer);
  engineTimer = setInterval(() => { if (game && game.running && !game.paused) SFX.engine(); }, 200);
}

document.getElementById('retry-btn').addEventListener('click', startGame);
document.getElementById('home-btn').addEventListener('click', exitToMenu);

pauseBtn.addEventListener('click', () => {
  if (game) game.togglePause();
});

exitBtn.addEventListener('click', exitToMenu);

function handleSoundBtn() {
  if (!audioCtx) {
    ensureAudio();
    SFX.start();
  } else {
    soundEnabled = !soundEnabled;
    soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
    if (soundEnabled && audioCtx.state === 'suspended') audioCtx.resume();
  }
}
soundBtn.addEventListener('click', handleSoundBtn);
soundBtn.addEventListener('touchend', (e) => { e.preventDefault(); handleSoundBtn(); });

class Game {
  constructor(charData) {
    this.charData = charData;
    this.resize();
    this.lanes = 3;
    this.roadL = this.w * 0.08;
    this.roadR = this.w * 0.92;
    this.roadW = this.roadR - this.roadL;
    this.laneWidth = this.roadW / this.lanes;
    this.playerLane = 1;
    this.playerX = this.roadL + this.laneWidth * 1 + this.laneWidth / 2;
    this.playerTargetX = 0;
    this.playerState = 'normal';
    this.stateTimer = 0;
    this.hp = charData.hp;
    this.maxHp = charData.hp;
    this.score = 0;
    this.speed = 4 * charData.speed;
    this.baseSpeed = this.speed;
    this.distance = 0;
    this.items = [];
    this.spawnTimer = 0;
    this.spawnInterval = 80;
    this.running = false;
    this.paused = false;
    this.shieldEnd = 0;
    this.combo = 0;
    this.lastDodge = 0;
    this.roadOffset = 0;
    this.bikeAngle = 0;
    this.bikeTargetAngle = 0;
    this.jumpY = 0;
    this.jumpVel = 0;
    this.duckAmount = 0;
    this.particles = [];
    this.frameId = null;
    this.swipeStart = null;
    this.touchId = null;
    this.barriers = [];
    this.initBarriers();

    this.onTouchStart = this.onTouchStart.bind(this);
    this.onTouchMove = this.onTouchMove.bind(this);
    this.onTouchEnd = this.onTouchEnd.bind(this);
    this.onKeyDown = this.onKeyDown.bind(this);
    this.loop = this.loop.bind(this);
  }

  resize() {
    const dpr = window.devicePixelRatio || 1;
    this.w = canvas.clientWidth;
    this.h = canvas.clientHeight;
    canvas.width = this.w * dpr;
    canvas.height = this.h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (this.lanes) {
      this.roadL = this.w * 0.08;
      this.roadR = this.w * 0.92;
      this.roadW = this.roadR - this.roadL;
      this.laneWidth = this.roadW / this.lanes;
    }
  }

  start() {
    window.addEventListener('touchstart', this.onTouchStart, { passive: false });
    window.addEventListener('touchmove', this.onTouchMove, { passive: false });
    window.addEventListener('touchend', this.onTouchEnd);
    window.addEventListener('keydown', this.onKeyDown);
    window.addEventListener('resize', () => this.resize());
    this.running = true;
    this.paused = false;
    this.updateHUD();
    this.loop();
  }

  stop() {
    this.running = false;
    window.removeEventListener('touchstart', this.onTouchStart);
    window.removeEventListener('touchmove', this.onTouchMove);
    window.removeEventListener('touchend', this.onTouchEnd);
    window.removeEventListener('keydown', this.onKeyDown);
    if (this.frameId) cancelAnimationFrame(this.frameId);
  }

  togglePause() {
    this.paused = !this.paused;
    pauseBtn.textContent = this.paused ? '▶' : '⏸';
    if (!this.paused) this.loop();
  }

  onTouchStart(e) {
    if (e.target.closest('#game-btns')) return;
    if (this.paused) return;
    const t = e.touches[0];
    if (!t) return;
    const rect = canvas.getBoundingClientRect();
    if (t.clientX >= rect.left && t.clientX <= rect.right) {
      e.preventDefault();
    }
    this.swipeStart = { x: t.clientX, y: t.clientY, time: Date.now() };
    this.touchId = t.identifier;
  }

  onTouchMove(e) {
    if (e.target.closest('#game-btns')) return;
    e.preventDefault();
  }

  onTouchEnd(e) {
    if (!this.swipeStart) return;
    const t = Array.from(e.changedTouches).find(ct => ct.identifier === this.touchId);
    if (!t) return;
    const dx = t.clientX - this.swipeStart.x;
    const dy = t.clientY - this.swipeStart.y;
    const dt = Date.now() - this.swipeStart.time;
    this.swipeStart = null;

    if (dt > 500) return;
    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);

    if (absDx < 25 && absDy < 25) return;

    const ratio = Math.max(absDx, absDy) / (Math.min(absDx, absDy) + 1);
    if (ratio < 1.5) return;

    if (absDx > absDy) {
      if (dx < -30) this.moveLeft();
      else if (dx > 30) this.moveRight();
    } else {
      if (dy < -40) this.jump();
      else if (dy > 40) this.duck();
    }
  }

  onKeyDown(e) {
    if (this.paused) return;
    switch(e.key) {
      case 'ArrowLeft': case 'a': this.moveLeft(); break;
      case 'ArrowRight': case 'd': this.moveRight(); break;
      case 'ArrowUp': case 'w': this.jump(); break;
      case 'ArrowDown': case 's': this.duck(); break;
    }
  }

  moveLeft() {
    if (this.playerLane > 0) {
      if (!this.canChangeLane(this.playerLane, this.playerLane - 1)) {
        this.showPopup('⛔ Vạch liền!', '#ff9800', 500);
        return;
      }
      this.playerLane--;
      this.bikeTargetAngle = -15;
      setTimeout(() => this.bikeTargetAngle = 0, 300);
    }
  }

  moveRight() {
    if (this.playerLane < 2) {
      if (!this.canChangeLane(this.playerLane, this.playerLane + 1)) {
        this.showPopup('⛔ Vạch liền!', '#ff9800', 500);
        return;
      }
      this.playerLane++;
      this.bikeTargetAngle = 15;
      setTimeout(() => this.bikeTargetAngle = 0, 300);
    }
  }

  jump() {
    if (this.jumpY === 0 && this.playerState !== 'duck') {
      this.playerState = 'jump';
      this.jumpVel = -12;
      SFX.jump();
    }
  }

  duck() {
    if (this.jumpY === 0 && this.playerState !== 'jump') {
      this.playerState = 'duck';
      this.stateTimer = 30;
      SFX.duck();
    }
  }

  initBarriers() {
    this.barriers = [];
    const segH = 120;
    for (let div = 0; div < 2; div++) {
      for (let y = -segH; y < this.h + segH; y += segH) {
        this.barriers.push({
          divider: div,
          y: y,
          height: segH,
          solid: Math.random() < 0.35
        });
      }
    }
  }

  updateBarriers() {
    const segH = 120;
    for (let i = this.barriers.length - 1; i >= 0; i--) {
      this.barriers[i].y += this.speed;
      if (this.barriers[i].y > this.h + segH) {
        this.barriers.splice(i, 1);
      }
    }
    for (let div = 0; div < 2; div++) {
      let minY = this.h;
      for (const b of this.barriers) {
        if (b.divider === div && b.y < minY) minY = b.y;
      }
      while (minY > -segH) {
        minY -= segH;
        this.barriers.push({
          divider: div,
          y: minY,
          height: segH,
          solid: Math.random() < 0.35
        });
      }
    }
  }

  canChangeLane(fromLane, toLane) {
    const divider = Math.min(fromLane, toLane);
    const py = this.h - 120;
    for (const b of this.barriers) {
      if (b.divider !== divider) continue;
      if (py >= b.y && py <= b.y + b.height && b.solid) return false;
    }
    return true;
  }

  spawnItem() {
    this.spawnTimer++;
    const interval = Math.max(30, this.spawnInterval - this.distance * 0.002);
    if (this.spawnTimer < interval) return;
    this.spawnTimer = 0;

    const lane = Math.floor(Math.random() * 3);
    const roll = Math.random();
    const pick = arr => arr[Math.floor(Math.random() * arr.length)];

    if (roll < 0.12) {
      this.items.push({ ...pick(REWARDS), lane, y: -50, isReward: true, collected: false });
    } else if (roll < 0.26) {
      this.items.push({ ...pick(FRIENDLY_ANIMALS), lane, y: -50, isReward: true, collected: false });
    } else if (roll < 0.40) {
      this.items.push({ ...pick(GOOD_FRUITS), lane, y: -50, isReward: true, collected: false });
    } else if (roll < 0.48) {
      this.items.push({ ...pick(DRINKS_GOOD), lane, y: -50, isReward: true, collected: false });
    } else if (roll < 0.58) {
      this.items.push({ ...pick(OBSTACLES), lane, y: -50, isReward: false, collected: false });
    } else if (roll < 0.72) {
      this.items.push({ ...pick(FIERCE_ANIMALS), lane, y: -50, isReward: false, collected: false });
    } else if (roll < 0.84) {
      this.items.push({ ...pick(BAD_FRUITS), lane, y: -50, isReward: false, collected: false });
    } else {
      this.items.push({ ...pick(DRINKS_BAD), lane, y: -50, isReward: false, collected: false });
    }
  }

  checkCollision(item) {
    const px = this.roadL + this.laneWidth * this.playerLane + this.laneWidth / 2;
    const py = this.h - 120 - this.jumpY;
    const ix = this.roadL + this.laneWidth * item.lane + this.laneWidth / 2;
    const iy = item.y;

    const dist = Math.sqrt((px - ix) ** 2 + (py - iy) ** 2);
    if (dist > 55) return false;

    if (this.playerState === 'jump' && this.jumpY > 10) return false;

    if (item.isReward) return true;
    if (item.zone === 'high' && this.playerState === 'duck') return false;

    return true;
  }

  addParticle(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      this.particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 6,
        vy: (Math.random() - 0.5) * 6 - 2,
        life: 30 + Math.random() * 20,
        color,
        size: 3 + Math.random() * 4
      });
    }
  }

  showPopup(text, color, duration = 800) {
    const el = document.createElement('div');
    el.className = 'combo-popup';
    el.textContent = text;
    el.style.color = color;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), duration);
  }

  flashScreen(color) {
    const flash = document.getElementById('dmg-flash');
    flash.style.background = color;
    flash.style.animation = 'none';
    flash.offsetHeight;
    flash.style.animation = color.includes('239') ? 'flashRed 0.3s ease-out forwards' : 'flashGreen 0.3s ease-out forwards';
  }

  update() {
    this.distance += this.speed;
    this.score = Math.floor(this.distance / 10);
    this.speed = this.baseSpeed + this.distance * 0.00015;
    this.roadOffset = (this.roadOffset + this.speed) % 40;

    if (this.playerState === 'jump') {
      this.jumpVel += 0.6;
      this.jumpY -= this.jumpVel;
      if (this.jumpY <= 0) {
        this.jumpY = 0;
        this.jumpVel = 0;
        this.playerState = 'normal';
      }
    }

    if (this.playerState === 'duck') {
      this.stateTimer--;
      if (this.stateTimer <= 0) {
        this.playerState = 'normal';
        this.stateTimer = 0;
      }
      this.duckAmount = Math.min(1, this.duckAmount + 0.15);
    } else {
      this.duckAmount = Math.max(0, this.duckAmount - 0.1);
    }

    this.bikeAngle += (this.bikeTargetAngle - this.bikeAngle) * 0.2;

    const targetX = this.roadL + this.laneWidth * this.playerLane + this.laneWidth / 2;
    this.playerX += (targetX - this.playerX) * 0.15;

    this.updateBarriers();
    this.spawnItem();

    for (let i = this.items.length - 1; i >= 0; i--) {
      const item = this.items[i];
      item.y += this.speed;

      if (!item.collected && this.checkCollision(item)) {
        item.collected = true;
        if (item.isReward) {
          if (item.heal) {
            this.hp = Math.min(this.maxHp, this.hp + item.heal);
            this.showPopup(item.desc, '#06d6a0');
            this.flashScreen('rgba(6, 214, 160, 0.3)');
            item.animal ? SFX.animalFriendly() : SFX.heal();
          }
          if (item.shield) {
            this.shieldEnd = Date.now() + item.shield;
            this.showPopup('BẤT TỬ!', '#ffd166');
            SFX.shield();
          }
          if (item.score) {
            this.score += item.score;
            if (!item.heal) this.showPopup(item.desc, item.fruit === 'good' ? '#4caf50' : '#ffd166');
            SFX.coin();
          }
          const pColor = item.fruit === 'good' ? '#4caf50' : item.drink ? '#29b6f6' : '#ffd166';
          this.addParticle(
            this.roadL + this.laneWidth * item.lane + this.laneWidth / 2,
            item.y, pColor, 8
          );
        } else {
          if (Date.now() < this.shieldEnd) {
            this.showPopup('ĐỠ ĐƯỢC!', '#ffd166');
            SFX.dodge();
            this.addParticle(
              this.roadL + this.laneWidth * item.lane + this.laneWidth / 2,
              item.y, '#ffd166', 6
            );
          } else {
            this.hp -= item.dmg;
            this.combo = 0;
            this.showPopup(item.desc || `-${item.dmg} HP`, item.fruit === 'bad' ? '#f44336' : '#ef476f');
            this.flashScreen('rgba(239, 71, 111, 0.4)');
            item.animal ? SFX.animalFierce() : SFX.hit();
            this.addParticle(
              this.roadL + this.laneWidth * item.lane + this.laneWidth / 2,
              item.y, '#ef476f', 10
            );
          }
        }
      }

      if (item.y > this.h + 50) {
        if (!item.collected && !item.isReward) {
          this.combo++;
          this.lastDodge = Date.now();
          if (this.combo >= 3) {
            const bonus = this.combo * 2;
            if (this.charData.name === 'Mẹ Trang') {
              this.hp = Math.min(this.maxHp, this.hp + Math.floor(bonus * 0.5));
            }
            this.showPopup(`COMBO x${this.combo}!`, '#ff6b35');
            SFX.combo();
          }
        }
        this.items.splice(i, 1);
      }
    }

    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.15;
      p.life--;
      if (p.life <= 0) this.particles.splice(i, 1);
    }

    if (this.hp <= 0) {
      this.hp = 0;
      this.gameOver();
      return;
    }

    this.updateHUD();
  }

  updateHUD() {
    const pct = Math.max(0, this.hp / this.maxHp * 100);
    const bar = document.getElementById('hp-bar');
    bar.style.width = pct + '%';
    bar.style.background = pct > 50 ? 'var(--hp-good)' : pct > 25 ? 'var(--hp-warn)' : 'var(--hp-bad)';
    document.getElementById('hp-text').textContent = Math.max(0, Math.ceil(this.hp)) + ' HP';
    document.getElementById('score-text').textContent = this.score + 'm';
    const ct = document.getElementById('combo-text');
    if (this.combo >= 3 && Date.now() - this.lastDodge < 2000) {
      ct.textContent = `COMBO x${this.combo}`;
    } else {
      ct.textContent = '';
    }
  }

  draw() {
    ctx.clearRect(0, 0, this.w, this.h);

    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const rootTheme = document.documentElement.getAttribute('data-theme');
    const dark = rootTheme === 'dark' || (rootTheme !== 'light' && isDark);

    ctx.fillStyle = dark ? '#1b5e20' : '#2e7d32';
    ctx.fillRect(0, 0, this.w, this.h);

    const grassOff = this.roadOffset;
    ctx.save();
    for (let y = -60 + (grassOff % 30); y < this.h + 30; y += 30) {
      for (let x = 0; x < this.w; x += 18) {
        const seed = (x * 73 + y * 137) & 0xff;
        if (seed > 140) continue;
        const shade = seed % 3;
        ctx.fillStyle = dark
          ? ['#2e7d32','#388e3c','#1b5e20'][shade]
          : ['#43a047','#66bb6a','#2e7d32'][shade];
        const bh = 6 + (seed % 5);
        const lean = ((seed % 7) - 3) * 0.8;
        ctx.beginPath();
        ctx.moveTo(x, y + bh);
        ctx.quadraticCurveTo(x + lean, y, x + 2, y + bh);
        ctx.fill();
      }
    }
    ctx.restore();

    const roadL = this.roadL;
    const roadR = this.roadR;
    const roadW = this.roadW;

    ctx.fillStyle = dark ? '#256427' : '#4caf50';
    ctx.fillRect(roadL, 0, roadW, this.h);

    for (let y = -60 + (grassOff % 24); y < this.h + 30; y += 24) {
      for (let x = roadL; x < roadR; x += 14) {
        const seed = (x * 59 + y * 113) & 0xff;
        if (seed > 120) continue;
        const shade = seed % 4;
        ctx.fillStyle = dark
          ? ['#2e7d32','#388e3c','#43a047','#1b5e20'][shade]
          : ['#66bb6a','#81c784','#4caf50','#43a047'][shade];
        const bh = 5 + (seed % 4);
        const lean = ((seed % 5) - 2) * 0.6;
        ctx.beginPath();
        ctx.moveTo(x, y + bh);
        ctx.quadraticCurveTo(x + lean, y, x + 1.5, y + bh);
        ctx.fill();
      }
    }

    for (const b of this.barriers) {
      const x = roadL + (roadW / 3) * (b.divider + 1);
      ctx.strokeStyle = dark ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.4)';
      ctx.lineWidth = b.solid ? 3 : 2;
      if (b.solid) {
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(x, b.y);
        ctx.lineTo(x, b.y + b.height);
        ctx.stroke();
      } else {
        ctx.setLineDash([12, 18]);
        ctx.beginPath();
        ctx.moveTo(x, b.y);
        ctx.lineTo(x, b.y + b.height);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    ctx.strokeStyle = dark ? '#1b5e20' : '#2e7d32';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(roadL, 0);
    ctx.lineTo(roadL, this.h);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(roadR, 0);
    ctx.lineTo(roadR, this.h);
    ctx.stroke();

    const actualLaneW = this.laneWidth;

    for (const item of this.items) {
      if (item.collected) continue;
      const ix = roadL + actualLaneW * item.lane + actualLaneW / 2;
      const bounce = item.animal ? Math.sin(Date.now() * 0.008 + item.lane * 2) * 6 : 0;
      const iy = item.y + bounce;

      ctx.save();
      ctx.font = `${item.w * 1.5}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (item.fruit === 'good') {
        ctx.shadowColor = '#4caf50';
        ctx.shadowBlur = 14;
      } else if (item.fruit === 'bad') {
        ctx.shadowColor = '#f44336';
        ctx.shadowBlur = 14;
      } else if (item.drink && item.isReward) {
        ctx.shadowColor = '#29b6f6';
        ctx.shadowBlur = 12;
      } else if (item.drink && !item.isReward) {
        ctx.shadowColor = '#ff7043';
        ctx.shadowBlur = 12;
      } else if (item.animal && item.isReward) {
        ctx.shadowColor = '#06d6a0';
        ctx.shadowBlur = 16;
      } else if (item.animal && !item.isReward) {
        ctx.shadowColor = '#ef476f';
        ctx.shadowBlur = 16;
      } else if (item.isReward) {
        ctx.shadowColor = '#ffd166';
        ctx.shadowBlur = 12;
      } else if (item.zone === 'high') {
        ctx.globalAlpha = 0.85;
        ctx.shadowColor = '#ef476f';
        ctx.shadowBlur = 8;
      }

      ctx.fillText(item.emoji, ix, iy);
      ctx.restore();

      if (item.animal) {
        ctx.save();
        ctx.font = 'bold 11px "Be Vietnam Pro"';
        ctx.textAlign = 'center';
        if (item.isReward) {
          ctx.fillStyle = dark ? 'rgba(6,214,160,0.7)' : 'rgba(5,184,138,0.8)';
          ctx.fillText(item.desc, ix, iy + item.h * 0.75 + 10);
        } else {
          ctx.fillStyle = dark ? 'rgba(239,71,111,0.7)' : 'rgba(214,58,92,0.8)';
          ctx.fillText(item.desc, ix, iy + item.h * 0.75 + 10);
        }
        ctx.restore();
      } else if (!item.isReward && item.zone === 'high') {
        ctx.fillStyle = dark ? 'rgba(239,71,111,0.3)' : 'rgba(214,58,92,0.3)';
        ctx.font = '10px "Be Vietnam Pro"';
        ctx.textAlign = 'center';
        ctx.fillText('▲ TRÊN CAO', ix, iy + item.h / 2 + 14);
      }
    }

    const px = roadL + actualLaneW * this.playerLane + actualLaneW / 2;
    const baseY = this.h - 100;
    const py = baseY - this.jumpY;

    const drawX = this.playerX;

    ctx.save();
    ctx.translate(drawX, py);
    ctx.rotate(this.bikeAngle * Math.PI / 180);
    ctx.scale(2, 2);

    const bikeScale = this.duckAmount > 0 ? 1 - this.duckAmount * 0.3 : 1;
    ctx.scale(1, bikeScale);

    if (Date.now() < this.shieldEnd) {
      ctx.shadowColor = '#ffd166';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.arc(0, -10, 40, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 209, 102, 0.15)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 209, 102, 0.5)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    if (this.combo >= 3 && Date.now() - this.lastDodge < 2000) {
      const t = Date.now() * 0.003;
      const level = Math.min(this.combo, 15);
      const glow = 8 + level * 3;
      const pulse = 0.7 + Math.sin(t * 2) * 0.3;
      const hue = (t * 60) % 360;
      ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
      ctx.shadowBlur = glow * pulse;

      const sparkCount = Math.min(level, 10);
      for (let s = 0; s < sparkCount; s++) {
        const angle = t * 3 + (s / sparkCount) * Math.PI * 2;
        const radius = 30 + Math.sin(t * 4 + s) * 8;
        const sx = Math.cos(angle) * radius;
        const sy = Math.sin(angle) * radius - 10;
        const size = 2 + Math.sin(t * 5 + s * 2) * 1.5;
        ctx.fillStyle = `hsla(${(hue + s * 30) % 360}, 100%, 70%, ${0.6 + Math.sin(t * 6 + s) * 0.4})`;
        ctx.beginPath();
        ctx.arc(sx, sy, size, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(0, -10, 35, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue}, 100%, 70%, ${0.06 * pulse})`;
      ctx.fill();
    }

    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(0, 30, 22, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(-16, 22, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.arc(16, 22, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#444';
    ctx.beginPath();
    ctx.arc(-16, 22, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(16, 22, 5, 0, Math.PI * 2);
    ctx.fill();
    const wheelSpin = Date.now() * 0.02;
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 1;
    for (const wx of [-16, 16]) {
      for (let s = 0; s < 4; s++) {
        const a = wheelSpin + s * Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(wx, 22);
        ctx.lineTo(wx + Math.cos(a) * 5, 22 + Math.sin(a) * 5);
        ctx.stroke();
      }
    }

    ctx.fillStyle = dark ? '#e53935' : '#c62828';
    ctx.beginPath();
    ctx.moveTo(-20, 18);
    ctx.lineTo(20, 18);
    ctx.lineTo(22, 5);
    ctx.lineTo(18, -8);
    ctx.lineTo(-14, -8);
    ctx.lineTo(-22, 5);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = dark ? '#ef5350' : '#d32f2f';
    ctx.beginPath();
    ctx.moveTo(-18, 5);
    ctx.lineTo(18, 5);
    ctx.lineTo(20, 18);
    ctx.lineTo(-20, 18);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = dark ? '#b71c1c' : '#a31515';
    ctx.beginPath();
    ctx.moveTo(-22, 6);
    ctx.lineTo(-20, 18);
    ctx.lineTo(-24, 16);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(22, 6);
    ctx.lineTo(20, 18);
    ctx.lineTo(24, 16);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'rgba(100,180,255,0.5)';
    ctx.beginPath();
    ctx.moveTo(-12, -7);
    ctx.lineTo(12, -7);
    ctx.lineTo(10, -1);
    ctx.lineTo(-10, -1);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    ctx.fillStyle = dark ? '#333' : '#222';
    ctx.beginPath();
    ctx.moveTo(-14, -8);
    ctx.lineTo(18, -8);
    ctx.lineTo(14, -14);
    ctx.lineTo(-10, -14);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#ffeb3b';
    ctx.beginPath();
    ctx.moveTo(18, 8);
    ctx.lineTo(23, 10);
    ctx.lineTo(23, 14);
    ctx.lineTo(18, 14);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#f44336';
    ctx.beginPath();
    ctx.moveTo(-18, 8);
    ctx.lineTo(-23, 10);
    ctx.lineTo(-23, 14);
    ctx.lineTo(-18, 14);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = dark ? '#777' : '#555';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.lineTo(0, 18);
    ctx.stroke();

    const charImg = charImages[selectedChar];
    if (charImg && charImg.complete && charImg.naturalWidth > 0) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, -22, 14, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(charImg, -14, -36, 28, 28);
      ctx.restore();

      ctx.beginPath();
      ctx.arc(0, -22, 14, 0, Math.PI * 2);
      ctx.strokeStyle = dark ? '#ffd166' : '#d4a843';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    } else {
      ctx.fillStyle = dark ? '#ffd166' : '#d4a843';
      ctx.beginPath();
      ctx.arc(0, -22, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#333';
      ctx.font = '10px serif';
      ctx.textAlign = 'center';
      ctx.fillText('😀', 0, -19);
    }

    if (this.duckAmount > 0) {
      ctx.fillStyle = dark ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.1)';
      ctx.font = '10px "Be Vietnam Pro"';
      ctx.textAlign = 'center';
      ctx.fillText('CÚI', 0, -45 / bikeScale);
    }

    if (this.jumpY > 20) {
      ctx.fillStyle = dark ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.1)';
      ctx.font = '10px "Be Vietnam Pro"';
      ctx.textAlign = 'center';
      ctx.fillText('BAY', 0, 45 / bikeScale);
    }

    ctx.restore();

    if (this.jumpY > 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.beginPath();
      ctx.ellipse(drawX, baseY + 60, 40 - this.jumpY * 0.12, 12 - this.jumpY * 0.03, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const p of this.particles) {
      ctx.globalAlpha = p.life / 50;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (p.life / 50), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  gameOver() {
    this.stop();
    if (engineTimer) { clearInterval(engineTimer); engineTimer = null; }
    SFX.gameover();
    hud.style.display = 'none';
    gameBtns.style.display = 'none';
    gameoverScreen.style.display = 'flex';
    document.getElementById('final-score').textContent = `Quãng đường: ${this.score}m`;

    let records = {};
    try { records = JSON.parse(localStorage.getItem('moto_records') || '{}'); } catch(e) {}
    const curName = this.charData.name;
    if (!records[curName] || this.score > records[curName]) {
      records[curName] = this.score;
    }
    for (const c of CHARS) {
      if (!records[c.name]) records[c.name] = 0;
    }
    try { localStorage.setItem('moto_records', JSON.stringify(records)); } catch(e) {}

    const sorted = CHARS.map(c => ({ name: c.name, score: records[c.name] || 0 }))
      .sort((a, b) => b.score - a.score);
    const medals = ['🥇', '🥈', '🥉', '4'];
    const lb = document.getElementById('leaderboard');
    lb.innerHTML = sorted.map((entry, i) => {
      const isCurrent = entry.name === curName;
      const rankClass = `r${i + 1}`;
      return `<div class="lb-row${isCurrent ? ' current' : ''}">
        <span class="lb-rank ${rankClass}">${medals[i]}</span>
        <span class="lb-name">${entry.name}</span>
        <span class="lb-score">${entry.score}m</span>
      </div>`;
    }).join('');
  }

  loop() {
    if (!this.running || this.paused) return;
    this.update();
    this.draw();
    this.frameId = requestAnimationFrame(this.loop);
  }
}
</script>
